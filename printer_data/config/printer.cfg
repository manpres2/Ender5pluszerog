Since you're already running Klipper on your other printer, I'll skip the basics and focus on what's Octopus-specific.
Get Klipper source on the hostSSH into the Pi/host running Klipper (or use KIAUH if you haven't already). If Klipper isn't installed yet: git clone https://github.com/Klipper3d/klipper and run the install script. If it's already installed for your other printer, just cd into ~/klipper — you'll compile a second firmware.bin for this board.
