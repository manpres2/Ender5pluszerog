# printer.cfg — BTT Octopus V1.0/V1.1 (STM32F407), CoreXY, TMC2209 UART
# Based on the standard Octopus pin mapping (same one Voron configs use).
# Verify against your actual wiring before first power-on — motor port
# order, endstop placement, and thermistor type can all vary by build.
[include timelapse.cfg]
[include Adaptive_Mesh.cfg]
[include KAMP_Settings.cfg]


[exclude_object]
#[include adxl.cfg]

[force_move]
enable_force_move: True
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_32002F001050304235343520-if00
# Replace with the output of: ls /dev/serial/by-id/*

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

#####################################################################
#   X Stepper (motor port 0)
#####################################################################
[stepper_x]
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG6
position_endstop: 350
homing_positive_dir: true
position_min: 0
position_max: 350
homing_speed: 150

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.600
stealthchop_threshold: 999999

#####################################################################
#   Y Stepper (motor port 1)
#####################################################################
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG9
position_endstop: 350
position_min: 0
position_max: 350              # set to your Y travel
homing_speed: 150

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.600
stealthchop_threshold: 999999

#####################################################################
#   Z Stepper(s) (motor ports 2 and 3 — dual Z shown, delete
#   stepper_z1 if you only have one Z motor)
#####################################################################
[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 400
homing_speed: 8

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.6
stealthchop_threshold: 0

[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PC7
run_current: 0.6
stealthchop_threshold: 0

[z_tilt]
z_positions:
    20, 187
    365, 187
points:
    65, 187
    335, 187
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
#####################################################################
#   Extruder (motor port 4)
#####################################################################

[bed_screws]
screw1: 60,30
screw2: 350,30
screw3: 350,330
screw4: 60,330

[screws_tilt_adjust]
screw1: 60,30
screw1_name: front left screw
screw2: 350,30
screw2_name: front right screw
screw3: 350,330
screw3_name: rear right screw
screw4: 60,330
screw4_name: rear left screw
horizontal_move_z: 7
speed: 250
screw_thread: CW-M4 

[extruder]
step_pin: PF9
!dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 7.36   # standard Bondtech-style gear ratio — recalc for your extruder
nozzle_diameter: 0.400
max_extrude_only_distance: 200
max_extrude_cross_section: 150
filament_diameter: 1.75
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F   # match to your actual hotend thermistor
sensor_pin: PF4
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 250
# Run PID_CALIBRATE after first boot — these PID values are placeholders

[tmc2209 extruder]
uart_pin: PF2
run_current: 0.600
stealthchop_threshold: 999999

#####################################################################
#   Heated Bed
#####################################################################
[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950             # match to your actual bed thermistor
sensor_pin: PF3
#control: pid
#pid_Kp: 58.437
#pid_Ki: 2.347
#pid_Kd: 363.769
min_temp: 0
max_temp: 130
# Run PID_CALIBRATE HEATER=heater_bed after first boot

#####################################################################
#   Fans
#####################################################################
[fan]
pin: PA8              # part cooling fan

[heater_fan hotend_fan]
pin: PE5               # hotend fan, runs whenever extruder is hot

#####################################################################
#   BLTouch (Octopus's dedicated BLTouch header — different pins
#   than the SKR mini E3 config this was adapted from)
#####################################################################
[bltouch]
sensor_pin: ^PB7
control_pin: PB6
x_offset: -33          # carry over from your old config — recheck vs new mount position
y_offset: -11
z_offset: 2.0          # PLACEHOLDER so Klipper will start — run PROBE_CALIBRATE and replace this
pin_move_time: 0.680
pin_up_touch_mode_reports_triggered: False
# stow_on_each_sample: False
# #probe_with_touch_mode: True
#z_offset: 0 #decrease for moving UP
# speed: 400
# lift_speed: 400
# samples: 2
# sample_retract_dist: 5
# samples_tolerance_retries: 3

#####################################################################
#   Bed Mesh
#####################################################################
[bed_mesh]
speed: 300
horizontal_move_z: 6
mesh_min: 20, 20
mesh_max: 300,300
probe_count: 6,6
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0   # Default Z Avg.
mesh_pps: 2,2  # Default 2,2
bicubic_tension: 0.2

#####################################################################
#   Misc
#####################################################################
[safe_z_home]
home_xy_position: 220.5, 198.5
speed: 200
z_hop: 10
z_hop_speed: 400

[input_shaper]
# Run SHAPER_CALIBRATE after mechanical assembly is done to fill this in
#shaper_freq_x: 0
#shaper_freq_y: 0
#shaper_type: mzv

[board_pins]
aliases:
    # add any custom aliases here if you rewire ports differently

#####################################################################
#   Fluidd / Mainsail requirements
#####################################################################
[virtual_sdcard]
path: ~/printer_data/gcodes
# adjust path if your install uses a different directory (e.g. ~/gcode_files)

[pause_resume]

[display_status]

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
    SAVE_GCODE_STATE NAME=PAUSE_state
    PAUSE_BASE
    G91
    G1 E-.5 Z10 F3600
    G90

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    G91
    G1 E.5 Z-10 F3600
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state
    RESUME_BASE

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE

