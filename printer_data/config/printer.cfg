This uses the standard Octopus V1.0/1.1 motor port pinout, so wiring your X to port 0, Y to port 1, etc. should match directly. A few things you'll need to fill in before it'll actually run:

    MCU serial path — swap in your actual /dev/serial/by-id/... string
    rotation_distance / travel limits — depend on your pulleys, lead screw, and frame size
    thermistor types — set to whatever's actually on your hotend and bed
    PID values — these are placeholders; run PID_CALIBRATE for both after first boot
    input_shaper — left blank until you run SHAPER_CALIBRATE

If you're copying this from a Voron build, double check your endstop pins match whether you're doing sensorless homing (TMC2209 stallguard) or physical microswitches — this config assumes physical switches on the pins shown.
