
# printer.cfg — BTT Octopus V1.0/V1.1 (STM32F407), CoreXY, TMC2209 UART
# Based on the standard Octopus pin mapping (same one Voron configs use).
# Verify against your actual wiring before first power-on — motor port
# order, endstop placement, and thermistor type can all vary by build.
 
[mcu]
serial: /dev/serial/by-id/usb-STMicroelectronics_MARLIN_BIGTREE_OCTOPUS_F429_CDC_in_FS_Mode_206434674230-if00
# Replace with the output of: ls /dev/serial/by-id/*
 
[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0
 
#####################################################################
#   X Stepper (motor port 0)
#####################################################################
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40          # 2GT pulley, 20 teeth — adjust if different
endstop_pin: ^PG6
position_endstop: 0
position_min: 0
position_max: 300              # set to your X travel
homing_speed: 50
 
[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.600
stealthchop_threshold: 999999
 
#####################################################################
#   Y Stepper (motor port 1)
#####################################################################
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG9
position_endstop: 0
position_min: 0
position_max: 300              # set to your Y travel
homing_speed: 50
 
[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.600
stealthchop_threshold: 999999
 
#####################################################################
#   Z Stepper(s) (motor ports 2 and 3 — dual Z shown, delete
#   stepper_z1 if you only have one Z motor)
#####################################################################
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8           # adjust for your lead screw pitch
endstop_pin: ^PG10
position_min: -5
position_max: 250              # set to your Z travel
homing_speed: 8
 
[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.600
stealthchop_threshold: 999999
 
[stepper_z1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 8
 
[tmc2209 stepper_z1]
uart_pin: PC7
run_current: 0.600
stealthchop_threshold: 999999
 
#####################################################################
#   Extruder (motor port 4)
#####################################################################
[extruder]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 22.6789511   # standard Bondtech-style gear ratio — recalc for your extruder
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F   # match to your actual hotend thermistor
sensor_pin: PF4
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250
# Run PID_CALIBRATE after first boot — these PID values are placeholders
 
[tmc2209 extruder]
uart_pin: PF2
run_current: 0.600
stealthchop_threshold: 999999
 
#####################################################################
#   Heated Bed
#####################################################################
[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950             # match to your actual bed thermistor
sensor_pin: PF3
control: pid
pid_Kp: 58.437
pid_Ki: 2.347
pid_Kd: 363.769
min_temp: 0
max_temp: 130
# Run PID_CALIBRATE HEATER=heater_bed after first boot
 
#####################################################################
#   Fans
#####################################################################
[fan]
pin: PA8              # part cooling fan
 
[heater_fan hotend_fan]
pin: PE5               # hotend fan, runs whenever extruder is hot
 
#####################################################################
#   Misc
#####################################################################
[safe_z_home]
home_xy_position: 150, 150   # centre of your bed — adjust
speed: 100
z_hop: 10
 
[input_shaper]
# Run SHAPER_CALIBRATE after mechanical assembly is done to fill this in
#shaper_freq_x: 0
#shaper_freq_y: 0
#shaper_type: mzv
 
[board_pins]
aliases:
    # add any custom aliases here if you rewire ports differently
 
