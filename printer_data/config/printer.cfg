One thing to watch: if this Octopus already has stock Marlin bootloader with a locked baud rate quirk, or you're moving TMC drivers from another firmware, power-cycle fully after flashing — Klipper won't read the TMC UART registers correctly otherwise until a clean boot.

If you're running this as a second printer's MCU alongside your existing Voron on the same host, make sure each gets a distinct -D out/<name> build directory so you don't overwrite the other's klipper.bin, and reference both by their /dev/serial/by-id/ paths in their respective config files.

